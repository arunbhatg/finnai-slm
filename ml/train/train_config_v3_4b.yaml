# FinnAI SLM v3 — ship student (real upgrade vs v2 1.7B)
base_model: Qwen/Qwen3-4B
model_name: FinnAI-SLM-v3-4B
seed: 42
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
train:
  epochs: 3
  lr: 1.5e-4
  batch_size: 1
  grad_accum: 16
  max_seq_len: 2048
  packing: false
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  val_rem_max_items: 384
quant:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
export:
  quantize: dynamic_int4_block32
  kv_cache_max_len: 1280
  prefill_seq_len: [8, 64, 128, 256, 512, 1024]
  nothink: true
region: us-east-2
instance: ml.g5.2xlarge
# Prefer ml.g5.4xlarge / A100 when available for faster 4B runs
notes: |
  Ship target for v3. Expect ~2–2.5GB INT4 on-device.
  After SFT, run train_dpo.py on data/out_v3/dpo_prefs.jsonl.
