# FinnAI SLM v3 — teacher (GPU-heavy). Not shipped on-device.
base_model: Qwen/Qwen3-8B
model_name: FinnAI-SLM-v3-teacher-8B
seed: 42
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
train:
  epochs: 2
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 16
  max_seq_len: 2048
  packing: false
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  val_rem_max_items: 256
quant:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
region: us-east-2
instance: ml.p4d.24xlarge
# Practical alternatives: g5.12xlarge / p3dn / A100 40GB single
notes: |
  Teacher for preference ranking and optional distill regenerations.
  Needs more VRAM than 4B; QLoRA NF4 is mandatory on a single 24GB card.
