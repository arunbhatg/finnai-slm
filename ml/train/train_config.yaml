base_model: Qwen/Qwen3-1.7B
model_name: FinnAI-SLM-v3-lite-1.7B
seed: 42
# NOTE: v3 *ship* target is Qwen3-4B — see train_config_v3_4b.yaml
# This file is for optional post-hoc distill / low-RAM lite SKU only.
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
train:
  epochs: 3
  lr: 2.0e-4
  batch_size: 2
  grad_accum: 8
  max_seq_len: 1536
  packing: false
  warmup_ratio: 0.03
  logging_steps: 20
  save_strategy: epoch
  val_rem_max_items: 384
quant:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
export:
  quantize: dynamic_int4_block32
  kv_cache_max_len: 1280
  prefill_seq_len: [8, 64, 128, 256, 512, 1024]
  nothink: true
region: ap-south-1
instance: ml.g5.2xlarge
# v3 data: build with
#   python -m data.build_splits --version v3 --out data/out_v3 --train-size 28000
# optional Nova: python -m data.generate_nova_indic --sms 2000 --chat 800 --out data/out/nova_indic.jsonl
#   then pass --extra data/out/nova_indic.jsonl to build_splits

